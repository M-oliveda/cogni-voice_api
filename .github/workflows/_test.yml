#
# Reusable test gate (MASTERPLAN.md §13.2): every hook in check mode, linters,
# type checks, security scans, and the full test suite with the 100% merged
# line and branch coverage gate. Called by ci.yml and, from Phase 2, by every
# deploy workflow before anything is deployed.
name: Test gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Hooks, linters, and full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pinned dependencies and hooks
        run: make setup

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run the pre-commit hooks on all files (check mode)
        run: .venv/bin/pre-commit run --all-files --show-diff-on-failure

      - name: Lint (flake8, pylint, Bandit)
        run: make lint

      - name: Type check (mypy strict)
        run: make typecheck

      - name: Audit dependencies for known vulnerabilities
        run: .venv/bin/pip-audit --disable-pip -r requirements.txt -r requirements-dev.txt

      - name: Start the local Supabase services for the E2E suite
        run: |
          make env
          docker compose up -d --wait db auth kong

      - name: Run the full test suite with the coverage gate
        env:
          # A missing E2E stack fails the run instead of skipping the suite.
          E2E_REQUIRED: "1"
        run: make cov

      - name: Show the Supabase service logs
        if: failure()
        run: docker compose logs db auth kong

      - name: Stop the local Supabase services
        if: always()
        run: docker compose down -v

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
