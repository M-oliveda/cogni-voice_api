#
# Infrastructure checks when infra/ changes (MASTERPLAN.md §13.2):
# Terraform is only formatted and validated (no plan, no apply, no state) and
# the setup scripts are linted. The scripts themselves are run manually.
name: infra

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [develop, main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt and validate (never plan or apply)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate without a backend
        run: |
          terraform init -backend=false -input=false
          terraform validate

  shellcheck:
    name: shellcheck infra/scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the setup scripts
        run: shellcheck -x infra/scripts/*.sh
