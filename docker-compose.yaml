# SPDX-License-Identifier: GPL-2.0-or-later
#
# Local development only (MASTERPLAN.md §13.4): one stack with the Supabase
# services, the API, and the worker. Deployed environments run on Cloud Run.
#
#   docker compose up --build             everything
#   docker compose up -d db auth kong     only Supabase (API or worker on the host)
#   docker compose --profile studio up    also Supabase Studio at http://localhost:54321
#   docker compose --profile ollama up    Ollama in Docker (Linux; on a Mac it runs natively)
#
# Values come from .env (create it with `make env`). The Supabase services are a
# trimmed set based on Supabase's official self-hosting Compose files: Postgres
# (with pgvector), Auth (GoTrue), and the Kong gateway; Studio and pg-meta are
# optional. Host ports bind to 127.0.0.1 only.
name: cognivoice

x-app: &app
  build:
    context: .
    target: dev
  env_file: .env
  environment:
    # Inside the network, services are reached by name instead of the host
    # ports used in .env.
    DATABASE_URL: postgresql+asyncpg://cognivoice_app:${COGNIVOICE_APP_DB_PASSWORD}@db:5432/postgres
    DATABASE_MIGRATION_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    SUPABASE_URL: http://kong:8000
    # Ollama on the host; with the "ollama" profile (Linux) set
    # COMPOSE_OLLAMA_URL=http://ollama:11434 in .env.
    OLLAMA_BASE_URL: ${COMPOSE_OLLAMA_URL:-http://host.docker.internal:11434}
  volumes:
    - .:/app
  extra_hosts:
    # Makes host.docker.internal work on Linux as it does on Docker Desktop.
    - host.docker.internal:host-gateway
  depends_on:
    db:
      condition: service_healthy
    kong:
      condition: service_healthy

services:
  # --- Application (entrypoints land in Phase 1: API, and Phase 4: worker) ---
  api:
    <<: *app
    ports:
      - 127.0.0.1:8000:8000

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]

  # --- Supabase ----------------------------------------------------------------
  db:
    # Keep in sync with POSTGRES_IMAGE in tests/conftest.py (a unit test checks).
    image: supabase/postgres:17.12.0.002
    restart: unless-stopped
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
      COGNIVOICE_APP_DB_PASSWORD: ${COGNIVOICE_APP_DB_PASSWORD}
    volumes:
      - ./supabase/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./supabase/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./supabase/volumes/db/cognivoice_app.sql:/docker-entrypoint-initdb.d/init-scripts/99-cognivoice-app.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    ports:
      - 127.0.0.1:54322:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.198.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ""
      # Users are invited by a Tenant Admin (MASTERPLAN.md §5); no self sign-up.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_ISSUER: http://localhost:54321/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  kong:
    image: kong/kong:3.9.5
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]
    depends_on:
      auth:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - ./supabase/volumes/api/kong.yml:/home/kong/temp.yml:ro
      - ./supabase/volumes/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro
    ports:
      - 127.0.0.1:54321:8000
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Optional: Supabase Studio (profile "studio") ----------------------------
  meta:
    image: supabase/postgres-meta:v0.100.1
    profiles: [studio]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  studio:
    image: supabase/studio:2026.11.23-sha-4a73166
    profiles: [studio]
    restart: unless-stopped
    depends_on:
      - meta
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      DEFAULT_ORGANIZATION_NAME: CogniVoice
      DEFAULT_PROJECT_NAME: Local
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:54321
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"

  # --- Optional: Ollama in Docker for Linux hosts (profile "ollama") -----------
  ollama:
    image: ollama/ollama:0.40.17
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - 127.0.0.1:11434:11434

volumes:
  db-data:
  db-config:
  ollama-models:
