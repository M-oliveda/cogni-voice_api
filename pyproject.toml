[project]
name = "cognivoice-api"
version = "0.1.0"
description = "Multi-tenant, API-first customer-feedback intelligence platform"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Mauricio Oliveda" }]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ['py314']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*", "*/venv/*", "*/.venv/*"]

[tool.mypy]
python_version = "3.14"
files = ["app", "scripts", "tests"]
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pylint.main]
py-version = "3.14"
jobs = 0
load-plugins = [
    "pylint.extensions.check_elif",
    "pylint.extensions.bad_builtin",
    "pylint.extensions.docparams",
    "pylint.extensions.for_any_all",
    "pylint.extensions.set_membership",
    "pylint.extensions.code_style",
    "pylint.extensions.overlapping_exceptions",
    "pylint.extensions.typing",
    "pylint.extensions.redefined_variable_type",
]

[tool.pylint.parameter_documentation]
default-docstring-type = "google"

[tool.pylint.messages_control]
max-line-length = 88
disable = [
    "C0103",  # invalid-name
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods (Pydantic models)
    "R0913",  # too-many-arguments (FastAPI endpoints)
    "R6003",  # consider-alternative-union-syntax (the standard is Optional[X])
    "R6103",  # consider-using-assignment-expr (walrus only where it reads better)
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 10
max-attributes = 15

[tool.bandit]
exclude_dirs = ["/tests", "/venv", "/.venv", "/migrations"]
skips = ["B101"]  # assert_used (we use asserts in tests)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, isolated tests (tests/unit)",
    "integration: tests against Postgres via Testcontainers (tests/integration)",
    "rls: tenant-isolation tests (tests/rls)",
    "contract: OpenAPI contract tests (tests/contract)",
    "agent: deterministic agent graph tests (tests/agent)",
    "e2e: end-to-end tests against the running stack (tests/e2e)",
    "evals: LLM-evaluated agent quality, never in the coverage gate (tests/evals)",
    "load: Locust load-test scenarios (tests/load)",
]
filterwarnings = ["error"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "--cov",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = ["app", "scripts"]
omit = [
    "*/tests/*",
    "migrations/versions/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"
